# ansible.cfg
# Ansible configuration for this project.
# Ansible checks this directory first, so this file takes effect
# for anyone who clones this repo without touching their system config.

[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback   = default
result_format     = yaml

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
