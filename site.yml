---
# site.yml
# Master playbook — entry point for everything.
# Run with:
#   ansible-playbook site.yml --check --diff   (dry run first, always)
#   ansible-playbook site.yml                  (apply)
#   ansible-playbook site.yml --tags <tag>     (run one role only)

- name: Base configuration
  hosts: all
  become: true
  roles:
    - role: base
      tags: [base]

- name: DB01 database server
  hosts: db01
  become: true
  gather_facts: true
  vars_files:
    - vars/main.yml
    - vars/secrets.yml
  roles:
    - role: db01
      tags: [db01]

- name: FS01 file server and CA infrastructure
  hosts: fs01
  become: true
  gather_facts: true
  vars_files:
    - vars/main.yml
    - vars/secrets.yml
  roles:
    - role: fs01
      tags: [fs01, infra]
