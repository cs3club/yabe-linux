---
- name: Install NFS utilities
  ansible.builtin.dnf:
    name:
      - nfs-utils
    state: present

- name: Check if NFS user exists
  ansible.builtin.command: id {{ item.name }}
  loop: "{{ nfs_users }}"
  register: nfs_user_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create NFS service accounts
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    uid: "{{ item.item.uid }}"
    system: true
    state: present
  loop: "{{ nfs_user_check.results }}"
  when: item.rc is defined and item.rc != 0
  no_log: true

- name: Configure NFS exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  notify: Reload NFS exports

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true

- name: Open NFS in firewall
  ansible.builtin.firewalld:
    service: nfs
    permanent: true
    state: enabled
    immediate: true
