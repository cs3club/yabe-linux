---
- name: Create sambausers group
  ansible.builtin.group:
    name: "{{ item.name }}"
    state: present
  loop: "{{ samba_groups }}"

- name: Create Samba share directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: '0770'
  loop: "{{ samba_groups }}"

# ------- User Offboarding -------
- name: Get list of Samba users on system
  ansible.builtin.shell: "pdbedit -L | cut -d: -f1"
  register: current_samba_users
  changed_when: false

- name: Remove offboarded Samba users
  ansible.builtin.shell: smbpasswd -x {{ item }}
  loop: "{{ current_samba_users.stdout_lines }}"
  when: item not in samba_users | map(attribute='name') | list
  changed_when: true
  failed_when: false

- name: Remove offboarded Linux users
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: true
  loop: "{{ current_samba_users.stdout_lines }}"
  when: item not in samba_users | map(attribute='name') | list

# ---- Linux User Onboarding -----
- name: Check if Linux user exists
  ansible.builtin.command: id {{ item.name }}
  loop: "{{ samba_users }}"
  register: samba_linux_user_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create Linux users for Samba
  ansible.builtin.user:
    name: "{{ item.item.name }}"
    groups: "{{ item.item.group }}"
    append: true
    state: present
  loop: "{{ samba_linux_user_check.results }}"
  when: item.rc is defined and item.rc != 0
  no_log: true

# --- Samba User Onboarding ---
- name: Check if Samba user exists
  ansible.builtin.shell: pdbedit -L | grep "^{{ item.name }}:"
  loop: "{{ samba_users }}"
  register: samba_user_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create Samba users
  ansible.builtin.shell: >
    printf '%s\n%s\n' '{{ item.item.password }}' '{{ item.item.password }}' |
    smbpasswd -a -s {{ item.item.name }}
  loop: "{{ samba_user_check.results }}"
  when: item.rc is defined and item.rc != 0
  changed_when: true
  no_log: true
