---
- name: Install Samba
  ansible.builtin.dnf:
    name:
      - samba
      - samba-common
      - samba-client
    state: present

- name: Deploy Samba config
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Samba

- name: Enable and start SMB
  ansible.builtin.service:
    name: smb
    state: started
    enabled: true

- name: Enable and start NMB
  ansible.builtin.service:
    name: nmb
    state: started
    enabled: true

# This enables both SMB/NMB in the firewall by default
- name: Open Samba in firewall
  ansible.builtin.firewalld:
    service: samba
    permanent: true
    state: enabled
    immediate: true
