---
# roles/redis/tasks/configure.yml
# Redis Configuration Tasks

- name: Create Redis data directory
  ansible.builtin.file:
    path: /var/lib/redis
    state: directory
    owner: redis
    group: redis
    mode: '0750'

- name: Create Redis config directory
  ansible.builtin.file:
    path: /etc/redis
    state: directory
    owner: redis
    group: redis
    mode: '0750'

- name: Create Redis default config file
  ansible.builtin.copy:
    dest: /etc/redis/default.conf
    owner: redis
    group: redis
    mode: '0640'
    content: |
      bind 127.0.0.1
      requirepass {{ redis_password }}
      loglevel notice
      dir /var/lib/redis

- name: Enable and start Redis service
  ansible.builtin.service:
    name: redis@default
    state: started
    enabled: true
