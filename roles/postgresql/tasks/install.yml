---
# roles/postgresql/tasks/install.yml
# PostgreSQL package installation tasks

- name: Install PostgreSQL
  community.general.zypper:
    name:
      - postgresql
      - postgresql-server
    state: present

- name: Install psycopg2 for Ansible PostgreSQL management
  community.general.zypper:
    name:
      - python3-psycopg2
    state: present
