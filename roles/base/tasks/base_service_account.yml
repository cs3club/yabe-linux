---
- name: Create Ansible service account
  ansible.builtin.user:
    name: ansible_svc
    shell: /bin/bash
    state: present

- name: Set up SSH key for ansible_svc
  ansible.builtin.authorized_key:
    user: ansible_svc
    key: "{{ lookup('pipe', 'cat ~/.ssh/id_ed25519.pub') }}"
    state: present

- name: Configure passwordless sudo for ansible_svc
  ansible.builtin.copy:
    content: "ansible_svc ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/ansible_svc
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Lock ansible_svc password
  ansible.builtin.user:
    name: ansible_svc
    password_lock: true
